<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mancave Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0e0f13; --panel: #171920; --panel-2: #1f222b; --border: #2a2e39;
    --text: #e8e9ee; --muted: #8b90a0; --gold: #f7931a; --green: #2ecc71; --red: #e74c3c; --purple: #9b59b6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 20px 24px; border-bottom: 1px solid var(--border); }
  header img { width: 48px; height: 48px; border-radius: 12px; background: var(--panel-2); }
  header img:not([src]) { display: none; }
  .chart-fallback { color: var(--muted); font-style: italic; }
  header h1 { margin: 0; font-size: 22px; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .updated { margin-left: auto; color: var(--muted); font-size: 12px; text-align: right; }
  main { padding: 20px 24px 40px; max-width: 1400px; margin: 0 auto; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .kpi .label { overflow-wrap: anywhere; }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .value { font-size: 26px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .chart-box { position: relative; height: 260px; }
  ol.rank { list-style: none; margin: 0; padding: 0; }
  ol.rank li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  ol.rank li:last-child { border-bottom: 0; }
  .pos { width: 28px; text-align: center; color: var(--muted); font-weight: 600; flex: none; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--panel-2); flex: none; object-fit: cover; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .badge { background: var(--panel-2); border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  .quote { border-left: 3px solid var(--gold); padding: 4px 10px; margin: 0 0 10px; color: var(--text); }
  .quote small { display: block; color: var(--muted); }
  @media (max-width: 600px) {
    header { padding: 16px; flex-wrap: wrap; } main { padding: 16px; }
    .grid { grid-template-columns: 1fr; } header .updated { margin-left: 0; text-align: left; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <img id="icon" alt="">
  <div>
    <h1 id="server">Mancave</h1>
    <div class="sub">Community-Dashboard</div>
  </div>
  <div class="updated" id="updated">lädt …</div>
</header>
<main>
  <section class="kpis" id="kpis"></section>
  <section class="grid">
    <div class="card wide">
      <h2>📈 Aktivität der letzten 30 Tage</h2>
      <div class="chart-box"><canvas id="activity"></canvas></div>
    </div>
    <div class="card"><h2>🏆 XP-Leaderboard</h2><ol class="rank" id="leaderboard"></ol></div>
    <div class="card"><h2>🔥 Check-in-Streaks</h2><ol class="rank" id="streaks"></ol></div>
    <div class="card"><h2>🏋️ Gym diese Woche</h2><ol class="rank" id="gym"></ol></div>
    <div class="card"><h2>🔗 Einladungen</h2><ol class="rank" id="invites"></ol></div>
    <div class="card"><h2>💡 Top-Ideen</h2><ol class="rank" id="ideas"></ol></div>
    <div class="card"><h2>🎯 Laufende Challenges</h2><ol class="rank" id="challenges"></ol></div>
    <div class="card wide"><h2>🏅 Neueste Hall-of-Fame-Wins</h2><div id="hof"></div></div>
  </section>
</main>
<script>
const fmt = n => (n ?? 0).toLocaleString("de-DE");
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const medal = i => ["🥇", "🥈", "🥉"][i] || `#${i + 1}`;

function rankList(id, items, metaFn, withAvatar = true) {
  const ol = document.getElementById(id);
  ol.replaceChildren();
  if (!items.length) { ol.append(el("li", "empty", "Noch keine Daten")); return; }
  items.forEach((it, i) => {
    const li = el("li");
    li.append(el("span", "pos", medal(i)));
    if (withAvatar) {
      const img = el("img", "avatar"); img.alt = ""; if (it.avatar) img.src = it.avatar; li.append(img);
    }
    li.append(el("span", "name", it.name ?? it.title));
    li.append(el("span", "meta", metaFn(it)));
    ol.append(li);
  });
}

let chart;
function drawChart(s) {
  const members = Object.fromEntries(s.members.map(m => [m.day, m.members]));
  const labels = s.days.map(d => d.slice(8, 10) + "." + d.slice(5, 7) + ".");
  const data = {
    labels,
    datasets: [
      { label: "Mitglieder", data: s.days.map(d => members[d] ?? null), borderColor: "#f7931a",
        backgroundColor: "#f7931a", yAxisID: "y1", tension: .3, spanGaps: true, pointRadius: 2 },
      { label: "Check-ins", data: s.checkins, type: "bar", backgroundColor: "#2ecc71cc", yAxisID: "y" },
      { label: "Workouts", data: s.workouts, type: "bar", backgroundColor: "#e74c3ccc", yAxisID: "y" },
    ],
  };
  const options = {
    responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
    plugins: { legend: { labels: { color: "#e8e9ee" } } },
    scales: {
      x: { ticks: { color: "#8b90a0", maxRotation: 0, autoSkip: true }, grid: { color: "#2a2e39" } },
      y: { beginAtZero: true, ticks: { color: "#8b90a0", precision: 0 }, grid: { color: "#2a2e39" },
           title: { display: true, text: "pro Tag", color: "#8b90a0" } },
      y1: { position: "right", ticks: { color: "#f7931a", precision: 0 }, grid: { drawOnChartArea: false },
            title: { display: true, text: "Mitglieder", color: "#f7931a" } },
    },
  };
  if (chart) { chart.data = data; chart.update(); return; }
  if (!window.Chart) {
    const box = document.getElementById("activity").parentElement;
    box.replaceChildren(el("p", "chart-fallback", "Diagramm konnte nicht geladen werden (keine Verbindung zu cdn.jsdelivr.net)."));
    box.style.height = "auto";
    return;
  }
  chart = new Chart(document.getElementById("activity"), { type: "line", data, options });
}

async function load() {
  let d;
  try {
    const r = await fetch("api/data", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    d = await r.json();
  } catch (e) {
    document.getElementById("updated").textContent = "⚠️ Daten konnten nicht geladen werden";
    return;
  }
  document.getElementById("server").textContent = d.server.name;
  document.title = d.server.name + " Dashboard";
  if (d.server.icon) document.getElementById("icon").src = d.server.icon;
  document.getElementById("updated").textContent = "Aktualisiert: " + new Date().toLocaleTimeString("de-DE") + " · alle 60 Sek.";

  const t = d.totals;
  const kpis = [
    ["👥 Mitglieder", d.server.members], ["🎙️ Gerade im Voice", d.server.online_voice],
    ["💬 Nachrichten", t.messages], ["✅ Check-ins heute", t.checkins_today],
    ["🏋️ Workouts (Woche)", t.workouts_week], ["💡 Ideen", t.ideas],
    ["🏅 Hall of Fame", t.hall_of_fame], ["🎫 Offene Tickets", t.open_tickets],
  ];
  document.getElementById("kpis").replaceChildren(...kpis.map(([label, value]) => {
    const k = el("div", "kpi"); k.append(el("div", "label", label), el("div", "value", fmt(value))); return k;
  }));

  rankList("leaderboard", d.leaderboard, u => `Lvl ${u.level} · ${fmt(u.xp)} XP`);
  rankList("streaks", d.streaks, u => `${u.streak} Tage`);
  rankList("gym", d.gym, u => `${fmt(u.minutes)} Min. · ${u.sessions}×`);
  rankList("invites", d.invites, u => `${u.count}`);
  rankList("ideas", d.ideas, i => `👍 ${i.up} · 👎 ${i.down} · ${i.author}`, false);
  rankList("challenges", d.challenges, c => `${c.participants} dabei · bis ${c.end.slice(8, 10)}.${c.end.slice(5, 7)}.`, false);

  const hof = document.getElementById("hof");
  hof.replaceChildren();
  if (!d.hall_of_fame.length) hof.append(el("div", "empty", "Noch keine Wins mit genug 🔥"));
  d.hall_of_fame.forEach(h => {
    const q = el("blockquote", "quote", h.content || "(Bild)");
    q.append(el("small", null, `— ${h.author} · 🔥 ${h.reactions} · ${h.day}`));
    hof.append(q);
  });

  drawChart(d.series);
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
