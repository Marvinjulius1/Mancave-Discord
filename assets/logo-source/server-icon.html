<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17131f"/><stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c45200"/><stop offset="0.5" stop-color="#f7931a"/><stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="85" height="85" patternUnits="userSpaceOnUse">
      <path d="M85 0 H0 V85" fill="none" stroke="#a66bff" stroke-width="2" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <!-- M als steigender Chart -->
  <polyline points="250,760 250,400 512,640 700,420" fill="none" stroke="url(#line)" stroke-width="92"
            stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Pfeil nach oben rechts -->
  <polyline points="700,420 792,312" fill="none" stroke="#ffd27a" stroke-width="92" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="700,250 860,236 846,396" fill="#ffd27a" filter="url(#glow)"/>
</svg></body></html>
